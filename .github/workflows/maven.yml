name: Product Management CI

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:

      # MySQL - used only during CI
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: product_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # Redis - used only during CI
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Verify Java
      - name: Verify Java version
        run: java -version

      # 4. Run tests
      - name: Run tests
        run: mvn -B clean test
        env:
          DB_USERNAME: root
          DB_PASSWORD: root

      # 5. Build application
      - name: Build application
        run: mvn -B package -DskipTests
        env:
          DB_USERNAME: root
          DB_PASSWORD: root

      # 6. Store generated JAR
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-management-application
          path: target/*.jar
