# ===============================
# Application
# ===============================
spring.application.name=product-management

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/product_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Hibernate SQL Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# Disable Open Session in View
# ===============================
spring.jpa.open-in-view=false

# ===============================
# Redis Configuration
# ===============================
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis.cache=DEBUG
logging.level.org.springframework.data.redis=DEBUG
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# Cache Configuration
# ===============================

spring.cache.type=redis